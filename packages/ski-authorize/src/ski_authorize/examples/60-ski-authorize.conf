# Copy this file to /etc/ssh/sshd_config.d/60-ski-authorize.conf as root.
# Review the CA fingerprint and local group policy before enabling access.
# OpenSSH 9 or later is required; run the helper as the unprivileged ski-authz account.

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
TrustedUserCAKeys /opt/ski-authorize/config/user-ca.pub
CASignatureAlgorithms ssh-ed25519
AuthorizedPrincipalsCommand /opt/ski-authorize/bin/ski-authorize --config /opt/ski-authorize/config/authorization.toml --ca-fingerprint %F %u %t %k
AuthorizedPrincipalsCommandUser ski-authz

AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no

# Optional early revocation is an Epic 6 feature; do not enable it here.
# RevokedKeys /opt/ski-authorize/config/revoked.krl
